name: Build Macro Pad 8 BIN
on:
  workflow_dispatch:
  push:
    branches: [main, master]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
        with:
          version: '1.1.1'
      - name: Install ESP32 and libraries
        run: |
          arduino-cli config init
          arduino-cli config add board_manager.additional_urls https://espressif.github.io/arduino-esp32/package_esp32_index.json
          arduino-cli core update-index
          arduino-cli core install esp32:esp32@2.0.17
          arduino-cli lib install 'ArduinoJson@6.21.5' 'NimBLE-Arduino@1.4.3'
          mkdir -p "$HOME/Arduino/libraries"
          git clone --depth 1 --branch 0.3.2-beta https://github.com/T-vK/ESP32-BLE-Keyboard.git "$HOME/Arduino/libraries/ESP32-BLE-Keyboard"
          sed -i -E 's@^[[:space:]]*//[[:space:]]*#define USE_NIMBLE.*$@#define USE_NIMBLE@' "$HOME/Arduino/libraries/ESP32-BLE-Keyboard/BleKeyboard.h"
          grep '^#define USE_NIMBLE' "$HOME/Arduino/libraries/ESP32-BLE-Keyboard/BleKeyboard.h"
      - name: Compile ESP32-C3
        run: |
          arduino-cli compile --fqbn esp32:esp32:esp32c3:CDCOnBoot=cdc,PartitionScheme=huge_app,FlashSize=4M,FlashMode=dio --output-dir build ESP32_MACRO_PAD_8_V1_0
      - name: Merge flash image at 0x0
        run: |
          python3 -m pip install 'esptool==4.8.1'
          mkdir -p output
          S=ESP32_MACRO_PAD_8_V1_0.ino
          python3 -m esptool --chip esp32c3 merge_bin -o output/ESP32_MACRO_PAD_8_V1_0_MERGED.bin --flash_mode dio --flash_size 4MB 0x0 "build/$S.bootloader.bin" 0x8000 "build/$S.partitions.bin" 0xe000 "$HOME/.arduino15/packages/esp32/hardware/esp32/2.0.17/tools/partitions/boot_app0.bin" 0x10000 "build/$S.bin"
          cd output
          sha256sum *.bin > SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: MacroPad8-ESPBoards-BIN
          path: output/
          if-no-files-found: error
